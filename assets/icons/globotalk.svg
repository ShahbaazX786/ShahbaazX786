<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="bubbleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="bubbleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle cx="600" cy="220" r="160" fill="#3b82f6" opacity="0.2" filter="url(#glow)" />

  <!-- Grid Pattern -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500" />
  </g>

  <!-- Globe / World Network Graphic -->
  <g transform="translate(400, 210)">
    <!-- Outer Globe Rings -->
    <ellipse cx="0" cy="0" rx="170" ry="170" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="170" ry="70" stroke="rgba(99,102,241,0.25)" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="70" ry="170" stroke="rgba(59,130,246,0.2)" stroke-width="1.5" />
    
    <!-- Connection Nodes -->
    <circle cx="-110" cy="-40" r="6" fill="#38bdf8" />
    <circle cx="-110" cy="-40" r="12" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    
    <circle cx="100" cy="30" r="6" fill="#818cf8" />
    <circle cx="100" cy="30" r="12" stroke="#818cf8" stroke-width="1.5" opacity="0.5" />
    
    <circle cx="30" cy="-80" r="5" fill="#ec4899" />
    <circle cx="-40" cy="70" r="5" fill="#34d399" />

    <!-- Connecting Arc Lines -->
    <path d="M-110 -40 Q 0 -110 100 30" stroke="url(#bubbleGrad1)" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.7" />
    <path d="M-110 -40 Q -70 40 -40 70" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.5" />
    <path d="M-40 70 Q 30 70 100 30" stroke="#818cf8" stroke-width="1.5" fill="none" opacity="0.5" />
  </g>

  <!-- Chat UI Mockup Bubbles -->
  <g transform="translate(180, 100)">
    <!-- Bubble 1: Incoming message -->
    <rect x="0" y="0" width="220" height="52" rx="18" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="26" cy="26" r="14" fill="#3b82f6" />
    <text x="26" y="31" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EN</text>
    <rect x="48" y="18" width="130" height="7" rx="3.5" fill="#94a3b8" />
    <rect x="48" y="30" width="80" height="6" rx="3" fill="#64748b" opacity="0.7" />
  </g>

  <g transform="translate(400, 160)">
    <!-- Bubble 2: Response message -->
    <rect x="0" y="0" width="240" height="54" rx="18" fill="url(#bubbleGrad1)" />
    <circle cx="28" cy="27" r="14" fill="#1e1b4b" />
    <text x="28" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#a5b4fc" text-anchor="middle">ES</text>
    <rect x="52" y="19" width="140" height="7" rx="3.5" fill="#ffffff" />
    <rect x="52" y="31" width="100" height="6" rx="3" fill="#c7d2fe" />
    <circle cx="218" cy="27" r="4" fill="#4ade80" />
  </g>

  <!-- Live Pulse Indicator Pill -->
  <g transform="translate(320, 40)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="rgba(15,23,42,0.85)" stroke="rgba(99,102,241,0.4)" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Real-time Stream</text>
  </g>
</svg>
