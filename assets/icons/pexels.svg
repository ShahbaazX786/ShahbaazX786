<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="photo1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="photo2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="photo3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="pexBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#pexBg)" />

  <!-- Warm ambient glow -->
  <circle cx="400" cy="200" r="160" fill="#f59e0b" opacity="0.15" filter="url(#pexBlur)" />
  <circle cx="250" cy="250" r="140" fill="#f43f5e" opacity="0.12" filter="url(#pexBlur)" />

  <!-- Mobile Devices Wallpaper Showcase Grid (like the reference JotDay mockup!) -->
  <g transform="translate(180, 20)">
    <!-- Left Angled Phone Mockup -->
    <g transform="rotate(-6 100 150) translate(0, 30)">
      <rect x="0" y="0" width="130" height="250" rx="22" fill="#18181b" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
      <rect x="6" y="6" width="118" height="238" rx="16" fill="url(#photo1)" />
      <!-- Wallpaper preview contents -->
      <circle cx="65" cy="80" r="28" fill="#38bdf8" opacity="0.7" />
      <path d="M10 200 L50 140 L85 175 L124 130 L124 244 L6 244 Z" fill="#0369a1" opacity="0.9" />
    </g>

    <!-- Center Hero Phone Mockup -->
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="145" height="275" rx="26" fill="#09090b" stroke="#f59e0b" stroke-width="2.5" />
      <rect x="7" y="7" width="131" height="261" rx="20" fill="url(#photo2)" />
      
      <!-- Top dynamic island -->
      <rect x="52" y="14" width="41" height="10" rx="5" fill="#000000" />
      
      <!-- Center mountain wallpaper artwork -->
      <circle cx="72" cy="90" r="32" fill="#fbbf24" opacity="0.85" />
      <path d="M10 240 L55 150 L90 190 L130 145 L138 268 L7 268 Z" fill="#881337" opacity="0.95" />
      <path d="M40 268 L85 190 L120 225 L138 200 L138 268 Z" fill="#4c0519" opacity="0.9" />
      
      <!-- Bottom Floating Wallpaper Action Pill -->
      <rect x="25" y="222" width="95" height="28" rx="14" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
      <text x="72" y="240" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Set Wallpaper</text>
    </g>

    <!-- Right Angled Phone Mockup -->
    <g transform="rotate(6 370 150) translate(310, 30)">
      <rect x="0" y="0" width="130" height="250" rx="22" fill="#18181b" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
      <rect x="6" y="6" width="118" height="238" rx="16" fill="url(#photo3)" />
      <!-- Wallpaper preview contents -->
      <circle cx="65" cy="75" r="26" fill="#6ee7b7" opacity="0.8" />
      <path d="M10 210 L50 155 L90 195 L124 150 L124 244 L6 244 Z" fill="#065f46" opacity="0.9" />
    </g>
  </g>
</svg>
