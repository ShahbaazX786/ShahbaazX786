<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mediaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180f28" />
      <stop offset="50%" stop-color="#0e0a18" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="aiGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <filter id="aiBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#mediaBg)" />

  <!-- Glowing background orbs -->
  <circle cx="280" cy="180" r="160" fill="#a855f7" opacity="0.25" filter="url(#aiBlur)" />
  <circle cx="540" cy="240" r="150" fill="#ec4899" opacity="0.2" filter="url(#aiBlur)" />
  <circle cx="400" cy="300" r="120" fill="#3b82f6" opacity="0.15" filter="url(#aiBlur)" />

  <!-- Center AI Studio Floating Panel -->
  <g transform="translate(200, 70)">
    <!-- Main glass container -->
    <rect x="0" y="0" width="400" height="240" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
    <!-- Top toolbar of studio panel -->
    <rect x="20" y="20" width="360" height="42" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <!-- AI Sparkle Icon -->
    <path d="M42 33 L45 41 L53 44 L45 47 L42 55 L39 47 L31 44 L39 41 Z" fill="url(#aiGlow1)" />
    <!-- Prompt placeholder bar -->
    <text x="64" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0" font-weight="500">A futuristic neon city with flying cars...</text>
    <!-- Generate Button -->
    <rect x="300" y="26" width="70" height="30" rx="8" fill="url(#aiGlow1)" />
    <text x="335" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Generate</text>

    <!-- 4 Modal Category Chips inside panel -->
    <g transform="translate(20, 80)">
      <!-- Text Chip -->
      <rect x="0" y="0" width="80" height="32" rx="8" fill="rgba(139,92,246,0.2)" stroke="rgba(139,92,246,0.4)" stroke-width="1" />
      <text x="40" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">✨ Text</text>

      <!-- Image Chip (Active) -->
      <rect x="90" y="0" width="85" height="32" rx="8" fill="url(#aiGlow1)" />
      <text x="132" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">🎨 Image</text>

      <!-- Audio Chip -->
      <rect x="185" y="0" width="80" height="32" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="225" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">🎵 Audio</text>

      <!-- Video Chip -->
      <rect x="275" y="0" width="85" height="32" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <text x="317" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">🎬 Video</text>
    </g>

    <!-- Mini Generated Art Previews Grid -->
    <g transform="translate(20, 128)">
      <rect x="0" y="0" width="110" height="92" rx="10" fill="#1e1b4b" stroke="rgba(168,85,247,0.3)" />
      <rect x="125" y="0" width="110" height="92" rx="10" fill="#31103f" stroke="rgba(236,72,153,0.3)" />
      <rect x="250" y="0" width="110" height="92" rx="10" fill="#0f172a" stroke="rgba(59,130,246,0.3)" />
      
      <!-- Abstract Artwork elements inside preview cards -->
      <circle cx="55" cy="46" r="24" fill="#6366f1" opacity="0.6" />
      <polygon points="180,24 160,68 200,68" fill="#ec4899" opacity="0.6" />
      <rect x="285" y="26" width="40" height="40" rx="8" fill="#38bdf8" opacity="0.5" />
    </g>
  </g>
</svg>
